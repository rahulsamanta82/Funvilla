<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create your Funvilla account to save favorite games and track your activity.">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="assetss/css/styles.css">

    <!-- ===== BOX ICONS ===== -->
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>

    <title>Login And Sign in</title>
</head>

<body data-auth-page>
    <div class="login">
        <div class="login__content">
            <div class="login__img">
                <img src="assetss/img/img-login.svg" alt="">
            </div>

            <div class="login__forms">
                <form action="" class="login__registre" id="login-in" novalidate>
                    <h1 class="login__title">Sign In</h1>

                    <div class="login__box">
                        <i class='bx bx-user login__icon'></i>
                        <input type="email" placeholder="Email" class="login__input" id="login-username"
                            name="email" autocomplete="email" required>
                    </div>

                    <div class="login__box">
                        <i class='bx bx-lock-alt login__icon'></i>
                        <input type="password" placeholder="Password" class="login__input" id="login-password"
                            name="password" autocomplete="current-password" required>
                    </div>

                    <a href="#" class="login__forgot" data-forgot-password>Forgot password?</a>

                    <p class="auth-message" data-login-message role="status" hidden></p>

                    <button type="submit" class="login__button">Sign In</button>

                    <div class="login__alt">
                        <div class="login__divider"><span>or</span></div>
                        <button type="button" class="login__alt-button" id="guest-login-btn">
                            <i class='bx bx-user-voice'></i>
                            Guest Login
                        </button>
                        <button type="button" class="login__alt-button login__alt-button-google" id="google-login-btn">
                            <svg class="login__google-icon" viewBox="0 0 48 48" aria-hidden="true">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                <path fill="none" d="M0 0h48v48H0z"></path>
                            </svg>
                            Sign in with Google
                        </button>
                    </div>

                    <div>
                        <span class="login__account">Don't have an Account ?</span>
                        <span class="login__signin" id="sign-up">Sign Up</span>
                    </div>
                </form>


                <form action="" class="login__create none" id="login-up" novalidate>
                    <h1 class="login__title">Create Account</h1>

                    <div class="login__box">
                        <i class='bx bx-user login__icon'></i>
                        <input type="text" placeholder="Username" class="login__input" id="signup-username"
                            name="username" autocomplete="username" minlength="2" maxlength="30" required>
                    </div>

                    <div class="login__box">
                        <i class='bx bx-at login__icon'></i>
                        <input type="email" placeholder="Email" class="login__input" id="signup-email"
                            name="email" autocomplete="email" required>
                    </div>

                    <div class="login__box">
                        <i class='bx bx-lock-alt login__icon'></i>
                        <input type="password" placeholder="Password" class="login__input" id="signup-password"
                            name="password" autocomplete="new-password" minlength="6" required>
                    </div>

                    <p class="auth-message" data-signup-message role="status" hidden></p>

                    <button type="submit" class="login__button">Sign Up</button>

                    <div>
                        <span class="login__account">Already have an Account ?</span>
                        <span class="login__signup" id="sign-in">Sign In</span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!--===== MAIN JS =====-->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="assets/js/funville.js"></script>
    <script src="assetss/js/main.js"></script>
</body>

</html>
